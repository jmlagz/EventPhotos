<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Revisa tu correo - EventPhotos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 420px;
            margin: 0 auto;
            padding: 60px 20px;
            background: #f7f7f7;
            color: #222;
        }

        .contenedor {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Revisa tu correo</h1>

        <p>
            Si existe una cuenta asociada al correo
            proporcionado, recibirás instrucciones
            para restablecer tu contraseña.
        </p>

        <p>
            Si no recibes el correo en unos minutos,
            revisa también tu carpeta de spam.
        </p>

        <a href="{% url 'login_anfitrion' %}">
            Volver al inicio de sesión
        </a>

    </div>

</body>
</html>
