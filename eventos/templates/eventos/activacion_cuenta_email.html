<!DOCTYPE html>
<html lang="es">
<body style="margin:0;padding:24px;background:#f7fbef;color:#073b4c;font-family:Arial,sans-serif;">
    <div style="max-width:560px;margin:0 auto;padding:28px;background:#ffffff;border:1px solid #d5e4e2;border-radius:16px;">
        <h1 style="margin:0 0 16px;font-size:26px;">Activa tu cuenta</h1>
        <p>Hola {{ usuario.first_name|default:"" }},</p>
        <p>Verifica tu correo para continuar en EventPhotos.</p>
        <p style="margin:26px 0;">
            <a href="{{ enlace_activacion }}" style="display:inline-block;padding:12px 18px;border-radius:12px;background:#16c7b0;color:#073b4c;font-weight:bold;text-decoration:none;">
                Activar mi cuenta
            </a>
        </p>
        <p>Este enlace vence en {{ expiration_hours }} horas.</p>

        <p>EventPhotos</p>
    </div>
</body>
</html>
