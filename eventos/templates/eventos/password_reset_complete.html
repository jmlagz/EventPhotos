<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contraseña actualizada - EventPhotos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 420px;
            margin: 0 auto;
            padding: 60px 20px;
            background: #f7f7f7;
            color: #222;
        }

        .contenedor {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        .boton {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 18px;
            border-radius: 9px;
            background: #333;
            color: white;
            text-decoration: none;
        }

        .boton:hover {
            background: #222;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Contraseña actualizada</h1>

        <p>
            Tu contraseña se cambió correctamente.
        </p>

        <p>
            Ya puedes iniciar sesión en EventPhotos.
        </p>

        <a
            href="{% url 'login_anfitrion' %}"
            class="boton"
        >
            Iniciar sesión
        </a>

    </div>

</body>
</html>
