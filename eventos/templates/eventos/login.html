<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión - EventPhotos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 420px;
            margin: 0 auto;
            padding: 60px 20px;
            background: #f7f7f7;
        }

        .contenedor {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .ayuda-usuario {
            margin-top: -10px;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .boton {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: 0;
            border-radius: 9px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #ffe5e5;
            color: #a00000;
        }
        .recuperar {
            margin-top: 18px;
            text-align: center;
        }

        .recuperar a {
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .recuperar a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>EventPhotos</h1>

        <p class="subtitulo">
            Panel del anfitrión
        </p>

        <form method="post">

            {% csrf_token %}

           <label for="username">
                Nombre de usuario
            </label>

            <p class="ayuda-usuario">
                Tu correo electrónico es tu nombre de usuario.
            </p>

            <input
                type="email"
                id="username"
                name="username"
                autocomplete="username"
                placeholder="tu-correo@ejemplo.com"
                required
            >

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <button
                type="submit"
                class="boton"
            >
                Iniciar sesión
            </button>

            <p class="recuperar">
                <a href="{% url 'password_reset' %}">
                    ¿Olvidaste tu contraseña?
                </a>
            </p>

        </form>

    </div>

</body>
</html>
