<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compartir fotos - {{ evento.nombre }}</title>

    <style>

:root {
    --primary: #635bff;
    --primary-2: #7c4dff;
    --text: #172033;
    --muted: #667085;
    --bg: #f5f7fb;
    --card: #ffffff;
    --border: #e7e9f0;
    --shadow: 0 18px 45px rgba(31, 41, 55, .10);
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
}

.topbar {
    height: 74px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 6%;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 17px;
}

.brand-mark {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 800;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    box-shadow: 0 8px 18px rgba(99, 91, 255, .25);
}

.page {
    width: min(720px, calc(100% - 32px));
    margin: 42px auto 70px;
}

.hero {
    color: #fff;
    text-align: center;
    padding: 34px 24px 32px;
    border-radius: 28px 28px 0 0;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
}

.camera-icon {
    width: 74px;
    height: 74px;
    margin: 0 auto 16px;
    display: grid;
    place-items: center;
    border-radius: 23px;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.25);
    font-size: 37px;
}

.hero h1 {
    margin: 0;
    font-size: clamp(30px, 6vw, 42px);
    line-height: 1.05;
    letter-spacing: -.8px;
}

.hero p {
    margin: 10px 0 0;
    font-size: 17px;
    font-weight: 600;
    opacity: .92;
}

.card {
    background: var(--card);
    padding: 32px;
    border-radius: 0 0 28px 28px;
    box-shadow: var(--shadow);
}

.footer {
    text-align: center;
    color: #8a92a3;
    font-size: 13px;
    margin-top: 30px;
}

.footer strong { color: #4b5565; }

button,
.primary-button {
    font: inherit;
}

@media (max-width: 600px) {
    .topbar { padding: 0 20px; }
    .page {
        width: min(100% - 20px, 720px);
        margin-top: 22px;
    }
    .hero {
        padding: 28px 18px 25px;
        border-radius: 22px 22px 0 0;
    }
    .card {
        padding: 24px 18px;
        border-radius: 0 0 22px 22px;
    }
}

.upload-card {
    text-align: center;
}

.upload-title {
    margin: 0;
    font-size: 26px;
}

.upload-subtitle {
    margin: 8px 0 24px;
    color: var(--muted);
}

.selector {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 145px;
    width: 100%;
    padding: 24px;
    border: 2px dashed #c8c5ff;
    border-radius: 20px;
    background: #fafaff;
    color: var(--primary);
    cursor: pointer;
    font-size: 18px;
    font-weight: 800;
    transition: .2s;
}

.selector:hover {
    border-color: var(--primary);
    background: #f5f4ff;
    transform: translateY(-1px);
}

.selector input {
    display: none;
}

.selector-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.selector-icon {
    font-size: 34px;
}

.selector-help {
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
}

.contador {
    margin-top: 18px;
    color: var(--muted);
    font-weight: 750;
}

.galeria {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 20px;
}

.foto {
    position: relative;
    aspect-ratio: 1;
    border-radius: 14px;
    overflow: hidden;
    background: #eee;
    box-shadow: 0 5px 15px rgba(16,24,40,.08);
}

.foto img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.mensaje {
    margin-top: 20px;
    padding: 13px 15px;
    border-radius: 12px;
    background: #f5f7fb;
    color: var(--text);
    font-weight: 650;
    line-height: 1.45;
}

.boton {
    display: block;
    width: 100%;
    padding: 16px;
    margin-top: 24px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: white;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(99,91,255,.22);
    transition: .2s;
}

.boton:not(:disabled):hover {
    transform: translateY(-1px);
}

.boton:disabled {
    opacity: .45;
    cursor: not-allowed;
    box-shadow: none;
}

.boton-album {
    display: block;
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: #fff;
    color: var(--text);
    font-size: 16px;
    font-weight: 750;
    text-decoration: none;
    transition: .2s;
}

.boton-album:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: #fafaff;
    transform: translateY(-1px);
}

@media (max-width: 600px) {
    .galeria {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 380px) {
    .galeria {
        grid-template-columns: repeat(2, 1fr);
    }
}
    </style>
</head>

<body>

<header class="topbar">
    <div class="brand">
        <div class="brand-mark">E</div>
        <span>EventPhotos</span>
    </div>
</header>

<main class="page">
    <section class="hero">
        <div class="camera-icon">📸</div>
        <h1>{{ evento.nombre }}</h1>
        <p>{{ mesa.etiqueta }}</p>
    </section>

    <section class="card upload-card">
        <h2 class="upload-title">Comparte tus fotos</h2>
        <p class="upload-subtitle">
            Selecciona hasta 20 fotos para compartir con los invitados.
        </p>

        <label class="selector">
            <span class="selector-content">
                <span class="selector-icon">📷</span>
                <span>Seleccionar fotos</span>
                <span class="selector-help">JPG, PNG, HEIC o HEIF · hasta 20 fotos</span>
            </span>

            <input
                type="file"
                id="selectorFotos"
                accept="image/jpeg,image/png,image/heic,image/heif"
                multiple
            >
        </label>

        <div id="contador" class="contador">
            0 de 20 fotos seleccionadas
        </div>

        <div
            id="mensaje"
            class="mensaje"
            style="display: none;"
        ></div>

        <div id="galeria" class="galeria"></div>

        <button
            id="botonSubir"
            class="boton"
            type="button"
            disabled
        >
            🚀 Compartir fotos
        </button>
        <a
            class="boton-album"
            href="{% url 'album_publico' slug=evento.slug %}"
        >
            🖼️ Ver álbum del evento
        </a>
    </section>

    
<div class="footer">
    EventPhotos · creado por <strong>LuisArt</strong><br>
    jmlagz@gmail.com
</div>

</main>

    <script>

        const selector = document.getElementById("selectorFotos");
        const galeria = document.getElementById("galeria");
        const contador = document.getElementById("contador");
        const mensaje = document.getElementById("mensaje");
        const botonSubir = document.getElementById("botonSubir");

        const MAX_FOTOS = 20;

        let fotosSeleccionadas = [];


        selector.addEventListener("change", function () {

            const nuevasFotos = Array.from(selector.files);

            mensaje.style.display = "none";
            mensaje.textContent = "";

            if (nuevasFotos.length > MAX_FOTOS) {

                mensaje.textContent =
                    "Puedes seleccionar un máximo de 20 fotos.";

                mensaje.style.display = "block";

                fotosSeleccionadas = nuevasFotos.slice(0, MAX_FOTOS);

            } else {

                fotosSeleccionadas = nuevasFotos;

            }

            mostrarPreviews();

        });


        function mostrarPreviews() {

            galeria.innerHTML = "";

            contador.textContent =
                `${fotosSeleccionadas.length} de ${MAX_FOTOS} fotos seleccionadas`;

            botonSubir.disabled =
                fotosSeleccionadas.length === 0;

            fotosSeleccionadas.forEach(function (foto) {

                const contenedor = document.createElement("div");

                contenedor.className = "foto";

                const imagen = document.createElement("img");

                imagen.alt = foto.name;
                imagen.src = URL.createObjectURL(foto);

                contenedor.appendChild(imagen);
                galeria.appendChild(contenedor);

            });

        }


        /*
        * SHA-256
        *
        * Implementación local para poder calcular el hash
        * incluso cuando estamos probando desde HTTP en la LAN.
        */

        function sha256(bytes) {

            const K = [
                0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,
                0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
                0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,
                0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
                0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,
                0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
                0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,
                0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
                0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,
                0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
                0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,
                0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
                0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,
                0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
                0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,
                0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
            ];

            let h0 = 0x6a09e667;
            let h1 = 0xbb67ae85;
            let h2 = 0x3c6ef372;
            let h3 = 0xa54ff53a;
            let h4 = 0x510e527f;
            let h5 = 0x9b05688c;
            let h6 = 0x1f83d9ab;
            let h7 = 0x5be0cd19;

            const bitLength = bytes.length * 8;

            const paddedLength =
                ((bytes.length + 9 + 63) >> 6) << 6;

            const data = new Uint8Array(paddedLength);

            data.set(bytes);
            data[bytes.length] = 0x80;

            const view = new DataView(data.buffer);

            view.setUint32(
                paddedLength - 4,
                bitLength >>> 0
            );

            view.setUint32(
                paddedLength - 8,
                Math.floor(bitLength / 0x100000000)
            );

            function rotr(x, n) {
                return (x >>> n) | (x << (32 - n));
            }

            for (let offset = 0; offset < paddedLength; offset += 64) {

                const w = new Uint32Array(64);

                for (let i = 0; i < 16; i++) {
                    w[i] = view.getUint32(
                        offset + i * 4
                    );
                }

                for (let i = 16; i < 64; i++) {

                    const s0 =
                        rotr(w[i - 15], 7) ^
                        rotr(w[i - 15], 18) ^
                        (w[i - 15] >>> 3);

                    const s1 =
                        rotr(w[i - 2], 17) ^
                        rotr(w[i - 2], 19) ^
                        (w[i - 2] >>> 10);

                    w[i] =
                        (w[i - 16] +
                        s0 +
                        w[i - 7] +
                        s1) >>> 0;
                }

                let a = h0;
                let b = h1;
                let c = h2;
                let d = h3;
                let e = h4;
                let f = h5;
                let g = h6;
                let h = h7;

                for (let i = 0; i < 64; i++) {

                    const S1 =
                        rotr(e, 6) ^
                        rotr(e, 11) ^
                        rotr(e, 25);

                    const ch =
                        (e & f) ^
                        (~e & g);

                    const temp1 =
                        (h + S1 + ch + K[i] + w[i]) >>> 0;

                    const S0 =
                        rotr(a, 2) ^
                        rotr(a, 13) ^
                        rotr(a, 22);

                    const maj =
                        (a & b) ^
                        (a & c) ^
                        (b & c);

                    const temp2 =
                        (S0 + maj) >>> 0;

                    h = g;
                    g = f;
                    f = e;
                    e = (d + temp1) >>> 0;
                    d = c;
                    c = b;
                    b = a;
                    a = (temp1 + temp2) >>> 0;
                }

                h0 = (h0 + a) >>> 0;
                h1 = (h1 + b) >>> 0;
                h2 = (h2 + c) >>> 0;
                h3 = (h3 + d) >>> 0;
                h4 = (h4 + e) >>> 0;
                h5 = (h5 + f) >>> 0;
                h6 = (h6 + g) >>> 0;
                h7 = (h7 + h) >>> 0;
            }

            return [
                h0,h1,h2,h3,h4,h5,h6,h7
            ].map(
                value => value.toString(16).padStart(8, "0")
            ).join("");

        }


        async function calcularHash(foto) {

            const buffer = await foto.arrayBuffer();

            return sha256(
                new Uint8Array(buffer)
            );

        }


        botonSubir.addEventListener("click", async function () {

            if (fotosSeleccionadas.length === 0) {
                return;
            }

            botonSubir.disabled = true;

            mensaje.style.display = "block";

            try {

                let subidas = 0;
                let duplicadas = 0;

                for (
                    let i = 0;
                    i < fotosSeleccionadas.length;
                    i++
                ) {

                    const foto = fotosSeleccionadas[i];

                    mensaje.textContent =
                        `Analizando foto ${i + 1} de ${fotosSeleccionadas.length}...`;

                    // 1. Calculamos SHA-256 localmente
                    const hash = await calcularHash(foto);

                    console.log(
                        "SHA-256:",
                        foto.name,
                        hash
                    );

                    mensaje.textContent =
                        `Preparando foto ${i + 1} de ${fotosSeleccionadas.length}...`;

                    // 2. Pedimos a Django una URL temporal
                    const datos = new URLSearchParams();

                    datos.append("nombre", foto.name);
                    datos.append("content_type", foto.type);
                    datos.append("hash_sha256", hash);
                    datos.append("tamaño", foto.size);

                    const respuesta = await fetch(
                        "{% url 'solicitar_url_subida' slug=evento.slug token=mesa.token %}",
                        {
                            method: "POST",

                            headers: {
                                "X-CSRFToken": "{{ csrf_token }}",
                                "Content-Type":
                                    "application/x-www-form-urlencoded",
                            },

                            body: datos,
                        }
                    );

                    const resultado =
                        await respuesta.json();

                    if (!respuesta.ok) {

                        throw new Error(
                            resultado.error ||
                            "No fue posible preparar la subida."
                        );

                    }

                    // 3. La foto ya existe
                    if (resultado.duplicada) {

                        duplicadas++;

                        continue;
                    }

                    // 4. Subimos directamente a R2
                    mensaje.textContent =
                        `Subiendo foto ${i + 1} de ${fotosSeleccionadas.length}...`;

                    const headersSubida =
                        resultado.headers || {
                            "Content-Type": foto.type,
                            "If-None-Match": "*",
                        };

                    const subida = await fetch(
                        resultado.url,
                        {
                            method: "PUT",

                            headers: headersSubida,

                            body: foto,
                        }
                    );

                    if (!subida.ok) {

                        throw new Error(
                            `R2 rechazó la subida de ${foto.name}.`
                        );

                    }

                    // 5. Registramos la foto en Django
                    const confirmacion =
                        new URLSearchParams();

                    confirmacion.append(
                        "upload_intent_id",
                        resultado.upload_intent_id
                    );

                    confirmacion.append(
                        "object_key",
                        resultado.object_key
                    );

                    confirmacion.append(
                        "nombre",
                        foto.name
                    );

                    confirmacion.append(
                        "content_type",
                        foto.type
                    );

                    confirmacion.append(
                        "hash_sha256",
                        hash
                    );

                    confirmacion.append(
                        "tamaño",
                        foto.size
                    );

                    const respuestaConfirmacion =
                        await fetch(
                            "{% url 'confirmar_subida' slug=evento.slug token=mesa.token %}",
                            {
                                method: "POST",

                                headers: {
                                    "X-CSRFToken": "{{ csrf_token }}",
                                    "Content-Type":
                                        "application/x-www-form-urlencoded",
                                },

                                body: confirmacion,
                            }
                        );

                    const resultadoConfirmacion =
                        await respuestaConfirmacion.json();

                    if (!respuestaConfirmacion.ok) {

                        throw new Error(
                            resultadoConfirmacion.error ||
                            "La foto se subió, pero no pudo registrarse."
                        );

                    }

                    if (resultadoConfirmacion.duplicada) {

                        duplicadas++;

                    } else {

                        subidas++;

                    }

                }

                if (subidas > 0 && duplicadas > 0) {

                    mensaje.textContent =
                        `✅ ${subidas} foto(s) subida(s). ` +
                        `♻️ ${duplicadas} ya existían.`;

                } else if (subidas > 0) {

                    mensaje.textContent =
                        `✅ ${subidas} foto(s) subida(s) correctamente.`;

                } else if (duplicadas > 0) {

                    mensaje.textContent =
                        `♻️ Las ${duplicadas} foto(s) ya habían sido compartidas.`;

                }

            } catch (error) {

                console.error(error);

                mensaje.textContent =
                    `❌ ${error.message}`;

                botonSubir.disabled = false;

            }

        });

    </script>
</body>
</html>
