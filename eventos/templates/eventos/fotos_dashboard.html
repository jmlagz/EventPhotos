<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fotos - {{ evento.nombre }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
            background: #f7f7f7;
        }

        .encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .volver {
            color: #555;
            text-decoration: none;
        }

        .resumen {
            margin-bottom: 25px;
            color: #666;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .foto {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .imagen {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
        }

        .informacion {
            padding: 12px;
        }

        .mesa {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .fecha {
            font-size: 13px;
            color: #777;
        }

        .boton-eliminar {
            width: 100%;
            margin-top: 10px;
            padding: 9px;
            border: 0;
            border-radius: 8px;
            background: #b00020;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .boton-eliminar:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .vacio {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            color: #666;
        }

        @media (max-width: 800px) {
            .galeria {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 550px) {
            .galeria {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .filtro-mesa {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filtro-mesa label {
            font-weight: bold;
        }

        .filtro-mesa select {
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: white;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="encabezado">

        <div>
            <h1>📸 Fotos</h1>

            <p>
                {{ evento.nombre }}
            </p>
        </div>

        <a
            href="{% url 'dashboard_evento' slug=evento.slug %}"
            class="volver"
        >
            ← Volver al evento
        </a>

    </div>


    <div class="resumen">
        {{ fotos|length }} foto(s)
    </div>

    <form method="get" class="filtro-mesa">

        <label for="mesa">
            Ver fotos de:
        </label>

        <select
            name="mesa"
            id="mesa"
            onchange="this.form.submit()"
        >

            <option value="">
                Todas las mesas
            </option>

            {% for mesa in mesas %}

                <option
                    value="{{ mesa.id }}"
                    {% if mesa_seleccionada == mesa.id|stringformat:"s" %}
                        selected
                    {% endif %}
                >
                    {{ mesa.etiqueta }}
                </option>

            {% endfor %}

        </select>

    </form>


    {% if fotos %}

        <div class="galeria">

            {% for item in fotos %}

                <div class="foto">

                    <img
                        src="{{ item.url }}"
                        alt="{{ item.foto.nombre_original }}"
                        class="imagen"
                    >

                    <div class="informacion">

                        <div class="mesa">
                            🪑 {{ item.foto.mesa.etiqueta }}
                        </div>

                        <div class="fecha">
                            {{ item.foto.creada_en|date:"d/m/Y H:i" }}
                        </div>

                        <button
                            type="button"
                            class="boton-eliminar"
                            data-foto-id="{{ item.foto.id }}"
                        >
                            🗑️ Eliminar
                        </button>

                    </div>

                </div>

            {% endfor %}

        </div>

    {% else %}

        <div class="vacio">
            Este evento todavía no tiene fotos.
        </div>

    {% endif %}


    <script>

        document.querySelectorAll(".boton-eliminar").forEach(
            function (boton) {

                boton.addEventListener(
                    "click",
                    async function () {

                        const fotoId =
                            boton.dataset.fotoId;

                        const confirmar = confirm(
                            "¿Quieres eliminar esta foto?"
                        );

                        if (!confirmar) {
                            return;
                        }

                        boton.disabled = true;
                        boton.textContent = "Eliminando...";

                        try {

                            const respuesta = await fetch(
                                "{% url 'eliminar_foto_dashboard' slug=evento.slug foto_id=0 %}"
                                    .replace(
                                        "/0/",
                                        `/${fotoId}/`
                                    ),
                                {
                                    method: "POST",

                                    headers: {
                                        "X-CSRFToken":
                                            "{{ csrf_token }}",
                                    },
                                }
                            );

                            const resultado =
                                await respuesta.json();

                            if (!respuesta.ok) {
                                throw new Error(
                                    resultado.error ||
                                    "No fue posible eliminar la foto."
                                );
                            }

                            const tarjeta =
                                boton.closest(".foto");

                            tarjeta.remove();

                        } catch (error) {

                            console.error(error);

                            alert(error.message);

                            boton.disabled = false;
                            boton.textContent = "🗑️ Eliminar";
                        }
                    }
                );
            }
        );

    </script>

</body>
</html>
