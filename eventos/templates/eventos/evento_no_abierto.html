<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Evento todavía no disponible - EventPhotos</title>

    <style>
        :root {
            --primary: #635bff;
            --primary-2: #7b43ff;
            --text: #1f2937;
            --muted: #667085;
            --surface: #ffffff;
            --border: #e8eaf0;
            --background: #f5f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--text);
            background:
                radial-gradient(
                    circle at top right,
                    rgba(99, 91, 255, .14),
                    transparent 34%
                ),
                var(--background);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        .card {
            width: min(560px, 100%);
            padding: 42px 32px;
            border: 1px solid var(--border);
            border-radius: 26px;
            background: var(--surface);
            box-shadow: 0 20px 52px rgba(31, 41, 55, .11);
            text-align: center;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
            font-weight: 800;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            color: #ffffff;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
        }

        .icon {
            width: 76px;
            height: 76px;
            display: grid;
            place-items: center;
            margin: 0 auto 22px;
            border-radius: 24px;
            color: var(--primary);
            background: #f0efff;
            font-size: 36px;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 6vw, 38px);
            line-height: 1.15;
            letter-spacing: -.5px;
        }

        p {
            max-width: 440px;
            margin: 16px auto 0;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.65;
        }

        .button {
            min-height: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 28px;
            padding: 13px 20px;
            border-radius: 14px;
            color: #ffffff;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            box-shadow: 0 10px 24px rgba(99, 91, 255, .22);
            font-weight: 800;
            text-decoration: none;
        }

        @media (max-width: 520px) {
            .card {
                padding: 34px 22px;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand" aria-label="EventPhotos">
            <span class="brand-mark" aria-hidden="true">E</span>
            <span>EventPhotos</span>
        </div>

        <div class="icon" aria-hidden="true">⏳</div>
        <h1>Este evento todavía no está abierto</h1>
        <p>
            Podrás compartir tus fotos cuando el anfitrión active el evento.
        </p>

        {% if dashboard_url %}
            <a class="button" href="{{ dashboard_url }}">
                Volver al dashboard del evento
            </a>
        {% endif %}
    </main>
</body>
</html>
