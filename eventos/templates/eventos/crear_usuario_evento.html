<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear anfitrión - EventPhotos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px 20px;
            background: #f7f7f7;
        }

        .encabezado {
            margin-bottom: 25px;
        }

        .volver {
            color: #555;
            text-decoration: none;
        }

        .seccion {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 8px;
        }

        .descripcion {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .campo {
            margin-bottom: 15px;
        }

        .errores {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #ffe5e5;
            color: #a00000;
        }

        .botones {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .boton {
            display: inline-block;
            padding: 11px 16px;
            border: 0;
            border-radius: 8px;
            background: #333;
            color: white;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
        }

        .boton-secundario {
            background: #e5e5e5;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="encabezado">

        <a
            href="{% url 'dashboard_evento' slug=evento.slug %}"
            class="volver"
        >
            ← Volver al evento
        </a>

    </div>

    <div class="seccion">

        <h1>Crear anfitrión</h1>

        <p class="descripcion">
            Crea un usuario para administrar el evento
            <strong>{{ evento.nombre }}</strong>.
            El anfitrión recibirá una invitación para crear
            su contraseña y activar su cuenta.
        </p>

        {% if form.non_field_errors %}
            <div class="errores">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="botones">

                <button
                    type="submit"
                    class="boton"
                >
                    Crear anfitrión
                </button>

                <a
                    href="{% url 'dashboard_evento' slug=evento.slug %}"
                    class="boton boton-secundario"
                >
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</body>
</html>
