<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Restablecer contraseña - EventPhotos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 420px;
            margin: 0 auto;
            padding: 60px 20px;
            background: #f7f7f7;
            color: #222;
        }

        .contenedor {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .boton {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: 0;
            border-radius: 9px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .boton:hover {
            background: #222;
        }

        .error {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #ffe5e5;
            color: #a00000;
        }

        .volver {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .volver:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>¿Olvidaste tu contraseña?</h1>

        <p class="subtitulo">
            Escribe el correo con el que tienes registrada
            tu cuenta de EventPhotos y te enviaremos
            instrucciones para restablecerla.
        </p>

        <form method="post">

            {% csrf_token %}

            <label for="{{ form.email.id_for_label }}">
                Correo electrónico
            </label>

            {{ form.email }}

            {% if form.email.errors %}
                <div class="error">
                    {{ form.email.errors }}
                </div>
            {% endif %}

            <button
                type="submit"
                class="boton"
            >
                Enviar instrucciones
            </button>

        </form>

        <a
            href="{% url 'login_anfitrion' %}"
            class="volver"
        >
            Volver al inicio de sesión
        </a>

    </div>

</body>
</html>
